[project]
name = "photo-studio"
version = "0.1.0"
description = "Local object/blemish removal for JPEG photos using LaMa (IOPaint), CPU-only"
requires-python = "==3.12.*"
dependencies = [
    "iopaint>=1.6",
    "pillow>=10",
    "numpy",
    "torch",
    "torchvision",
]

[tool.uv]
package = false
# gradio is only used by `iopaint start-web-config`, which this toolkit never runs
exclude-dependencies = ["gradio"]
# iopaint pins pillow==9.5.0 (no Python 3.12 wheels) and old, vulnerable web-server deps
override-dependencies = [
    "pillow>=10",
    "fastapi>=0.120",
    "starlette>=1.3.1",
    "python-socketio>=5.16.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
